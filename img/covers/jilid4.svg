  <text x="200" y="323" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="white">Tata Bahasa &amp;</text>
  <text x="200" y="356" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="white">Percakapan</text>
