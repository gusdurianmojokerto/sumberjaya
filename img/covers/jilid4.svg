  <text x="200" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="3">SENTENCES - CONVERSATION - TEST</text>
  <!-- Bottom bar -->
