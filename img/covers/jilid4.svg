      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="400" height="520" rx="18" fill="url(#bg4)"/>
  <rect width="400" height="520" rx="18" fill="rgba(255,255,255,0.06)"/>
  <!-- Decorative circles -->
