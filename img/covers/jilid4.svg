  <g transform="translate(160,108)" fill="none" stroke="white" stroke-width="1.8" opacity="0.85">
    <polygon points="40,4 49,20 66,23 54,34 58,52 40,43 22,52 26,34 14,23 31,20" fill="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <circle cx="40" cy="28" r="7" fill="rgba(255,255,255,0.08)" stroke="none"/>
    <text x="40" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" opacity="0.5" stroke="none">4</text>
  </g>
  <!-- Speech bubbles decoration -->
