    <path d="M4 4h16v16H4z" fill="rgba(255,255,255,0.15)"/>
    <line x1="24" y1="12" x2="32" y2="12" stroke="white" stroke-width="1.5" opacity="0.5"/>
    <line x1="24" y1="18" x2="32" y2="18" stroke="white" stroke-width="1.5" opacity="0.5"/>
    <line x1="24" y1="24" x2="32" y2="24" stroke="white" stroke-width="1.5" opacity="0.5"/>
  </g>
  <!-- Decorative line -->
  <line x1="80" y1="240" x2="320" y2="240" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
