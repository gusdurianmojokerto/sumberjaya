      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="400" height="520" rx="18" fill="url(#bg1)"/>
  <rect width="400" height="520" rx="18" fill="rgba(255,255,255,0.06)"/>
  <!-- Decorative circles -->
  <circle cx="340" cy="60" r="80" fill="rgba(255,255,255,0.04)"/>
