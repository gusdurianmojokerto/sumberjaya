  <line x1="140" y1="380" x2="260" y2="380" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="200" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" letter-spacing="4">ANIMALS - FOOD - WEATHER</text>
  <!-- Bottom bar -->
  <rect x="0" y="480" width="400" height="40" rx="0" fill="rgba(0,0,0,0.12)"/>
  <text x="200" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)" letter-spacing="3">Pertemuan 13 - 24</text>
