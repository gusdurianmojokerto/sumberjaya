  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="rgba(255,255,255,0.8)" letter-spacing="8">JILID 2</text>
  <!-- Title -->
  <text x="200" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="white">Hewan, Makanan</text>
  <text x="200" y="353" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="white">&amp; Alam</text>
