<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="520" rx="18" fill="url(#bg2)"/>
  <rect width="400" height="520" rx="18" fill="rgba(255,255,255,0.06)"/>
  <!-- Decorative circles -->
  <circle cx="340" cy="60" r="80" fill="rgba(255,255,255,0.04)"/>
  <circle cx="60" cy="460" r="100" fill="rgba(255,255,255,0.03)"/>
  <!-- Leaf decorations -->
