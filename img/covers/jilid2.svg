    <circle cx="129" cy="369" r="4.5"/>
    <circle cx="140" cy="362" r="4.5"/>
    <circle cx="151" cy="369" r="4.5"/>
    <circle cx="250" cy="410" r="7"/>
    <circle cx="239" cy="399" r="4.5"/>
    <circle cx="250" cy="392" r="4.5"/>
    <circle cx="261" cy="399" r="4.5"/>
  </g>
  <!-- Large number background -->
  <text x="200" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="160" font-weight="bold" fill="white" opacity="0.12">2</text>
  <!-- Tree/leaf icon -->
  <g transform="translate(160,120)" fill="none" stroke="white" stroke-width="2" opacity="0.8">
    <path d="M40,50 L40,15" stroke-width="2.5"/>
    <path d="M20,35 Q40,10 60,35" stroke-width="2" fill="rgba(255,255,255,0.1)"/>
    <path d="M15,25 Q40,5 65,25" stroke-width="2" fill="rgba(255,255,255,0.08)"/>
    <circle cx="40" cy="50" r="4" fill="rgba(255,255,255,0.15)" stroke="none"/>
    <circle cx="30" cy="46" r="2.5" fill="rgba(255,255,255,0.15)" stroke="none"/>
    <circle cx="50" cy="46" r="2.5" fill="rgba(255,255,255,0.15)" stroke="none"/>
  </g>
  <!-- Decorative line -->
  <line x1="80" y1="240" x2="320" y2="240" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
